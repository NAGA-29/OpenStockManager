name: Frontend CI

on:
  push:
    branches:
      - develop
      - feature/*
      - feat/*
      - hotfix/*
  pull_request:
    branches:
      - develop

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
