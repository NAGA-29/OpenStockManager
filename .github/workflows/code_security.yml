name: Code Security Check

on:
  push:
    branches:
      - develop
      - feature/*
      - feat/*
      - hotfix/*

defaults:
  run:
    working-directory: api

jobs:
  security-check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: "none"

      - name: Install Local PHP Security Checker
        run: wget https://github.com/fabpot/local-php-security-checker/releases/download/v2.1.3/local-php-security-checker_linux_amd64 -O local-php-security-checker && chmod +x local-php-security-checker

      - name: Run Local PHP Security Checker
        id: php-check
        run: |
          if ! ./local-php-security-checker; then
            echo "PHP_FAILED=true" >> $GITHUB_ENV
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Node.jsのバージョンを指定
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # フロントエンド(frontend/)の依存を監査。Laravel(api/)は API 専用で Node 依存なし。
      - name: Install npm dependencies using npm ci
        working-directory: frontend
        run: npm ci

        # 詳細を確認（出荷される本番依存のみ監査。vite/esbuild 等の開発ツールの
        # 脆弱性は SPA ビルド成果物に含まれないため対象外とする）
      - name: Run npm audit
        id: node-check
        working-directory: frontend
        run: |
          if ! npm audit --omit=dev; then
            echo "NODE_FAILED=true" >> $GITHUB_ENV
          fi

        # エラーチェック
      - name: Check Security Results
        run: |
          if [ "${{ env.PHP_FAILED }}" == "true" ] || [ "${{ env.NODE_FAILED }}" == "true" ]; then
            echo "Security issues detected in PHP or Node.js"
            exit 1
          fi
