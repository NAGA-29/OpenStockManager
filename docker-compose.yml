services:
    api:
        build:
            context: ./api/docker/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1337}'
        image: odm-api:8.4
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            XDEBUG_MODE: '${XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - './api:/var/www/html'
        networks:
            - app
        depends_on:
            - redis
            - meilisearch
            - mailpit
            - pgsql

    # React (Vite) SPA frontend
    frontend:
        image: node:22-bookworm-slim
        working_dir: /app
        command: sh -c "corepack enable && pnpm install && pnpm run dev -- --host"
        ports:
            - '${VITE_PORT:-5173}:5173'
        environment:
            CI: 'true'
            VITE_API_BASE_URL: '${VITE_API_BASE_URL:-}'
            VITE_DEV_API_PROXY_TARGET: '${VITE_DEV_API_PROXY_TARGET:-http://api}'
        volumes:
            - './frontend:/app'
            - 'frontend-node-modules:/app/node_modules'
        networks:
            - app
        depends_on:
            - api

    pgsql:
        image: 'postgres:14'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            POSTGRES_DB: '${DB_DATABASE:-laravel}'
            POSTGRES_USER: '${DB_USERNAME:-app}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'odm-pgsql:/var/lib/postgresql/data'
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE:-laravel}'
                - '-U'
                - '${DB_USERNAME:-app}'
            retries: 3
            timeout: 5s
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'odm-redis:/data'
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    meilisearch:
        image: 'getmeili/meilisearch:v1.8.1'
        ports:
            - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
        environment:
            MEILI_NO_ANALYTICS: '${MEILISEARCH_NO_ANALYTICS:-false}'
        volumes:
            - 'odm-meilisearch:/meili_data'
        networks:
            - app
        healthcheck:
            test:
                - CMD
                - wget
                - '--no-verbose'
                - '--spider'
                - 'http://localhost:7700/health'
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - app

networks:
    app:
        driver: bridge
volumes:
    odm-redis:
        driver: local
    odm-meilisearch:
        driver: local
    odm-pgsql:
        driver: local
    frontend-node-modules:
        driver: local
